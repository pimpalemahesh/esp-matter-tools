#
# Per-role MCORE default profile for a Commissioner (a device that commissions
# other nodes). It is an IM client, so client-side capabilities are allowed.

role: commissioner

seeds:
  - MCORE.ROLE.COMMISSIONER

deny:
  - MCORE.ROLE.CONTROLLER

feature_area_gates:
  ota_requestor:
    - MCORE.OTA.HTTPS
    - MCORE.OTA.RequestorConsent
    - MCORE.OTA.Resume
    - MCORE.OTA.Retry
  bridge:
    - MCORE.BRIDGE
    - MCORE.BRIDGE.*
  ota_provider:
    - MCORE.OTA.Provider
  icd:
    - MCORE.SC.SIT_ICD
