# Per-role MCORE default profile for a Controller (administers other nodes).

role: controller

seeds:
  - MCORE.ROLE.CONTROLLER

deny:
  - MCORE.ROLE.COMMISSIONER

feature_area_gates:
  ota_requestor:
    - MCORE.OTA.HTTPS
    - MCORE.OTA.RequestorConsent
    - MCORE.OTA.Resume
    - MCORE.OTA.Retry
  bridge:
    - MCORE.BRIDGE
    - MCORE.BRIDGE.*
  ota_provider:
    - MCORE.OTA.Provider
  icd:
    - MCORE.SC.SIT_ICD
